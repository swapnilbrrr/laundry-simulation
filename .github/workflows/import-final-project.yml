name: Import final Spring Boot project

on:
  push:
    paths:
      - "_import/project.b64.**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild repository from final source archive
        shell: bash
        run: |
          set -euo pipefail
          cat _import/project.b64.00 _import/project.b64.01 _import/project.b64.02 > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.zip
          rm -rf /tmp/project
          mkdir -p /tmp/project
          unzip -q /tmp/project.zip -d /tmp/project

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/project/. .

          rm -rf _import .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild laundry simulation as Spring Boot Maven project" || true
          git push
