name: import-final-project
on:
  workflow_dispatch:
  push:
    paths:
      - "_import/**"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild repository from project archive
        shell: bash
        run: |
          set -euo pipefail
          cat _import/project.b64.* > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.zip
          rm -rf /tmp/project
          mkdir -p /tmp/project
          unzip -q /tmp/project.zip -d /tmp/project
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/project/. .
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild laundry simulation as Spring Boot Maven project" || true
          git push
